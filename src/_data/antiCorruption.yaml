- id: commission
  title: Комиссия по урегулированию конфликта интересов
  content: '<p>В ГБПОУ РО «СИТ» создана комиссия по соблюдению требований к служебному
    поведению и урегулированию конфликта интересов. Основные задачи: рассмотрение
    вопросов о возникновении конфликта интересов, выработка рекомендаций по его предотвращению
    и контроль за выполнением обязательств сотрудниками.</p>

    '
  documents: []
- id: income
  title: Сведения о доходах руководителей
  content: '<p>Информация о доходах, расходах, об имуществе и обязательствах имущественного
    характера руководителей публикуется в соответствии с требованиями законодательства
    РФ.</p>

    '
  documents:
