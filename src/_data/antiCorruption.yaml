  - id: commission
    title: Комиссия по урегулированию конфликта интересов
    content: |
      <p>В ГБПОУ РО "СИТ" создана комиссия по соблюдению требований к служебному поведению и урегулированию конфликта интересов.</p>
      <p><strong>Основные функции комиссии:</strong></p>
      <ul>
        <li>Рассмотрение вопросов о возникновении конфликта интересов</li>
        <li>Выработка рекомендаций по предотвращению и урегулированию конфликта интересов</li>
        <li>Контроль за выполнением обязательств сотрудниками</li>
      </ul>
    documents:
      - title: Приказ о создании комиссии №45 от 15.01.2024
        type: pdf
        size: "210 КБ"
        url: "#"
        signed: true
