backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "news"
    label: "Новости"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime" }
      - { label: "Краткое описание", name: "description", widget: "text" }
      - { label: "Рубрика", name: "rubric", widget: "relation", collection: "rubrics", searchFields: ["title"], valueField: "code", displayFields: ["title"] }
      - { label: "Теги", name: "tags", widget: "list", default: [] }
      - { label: "Макет", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Постоянная ссылка", name: "permalink", widget: "hidden", default: "/news/{{year}}/{{month}}/{{day}}/{{slug}}/" }
      - { label: "Текст новости", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Страницы"
    folder: "src/content/pages"
    create: true
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Путь", name: "permalink", widget: "string" }
      - { label: "Рубрика", name: "rubric", widget: "relation", collection: "rubrics", searchFields: ["title"], valueField: "code", displayFields: ["title"], required: false }
      - { label: "Теги", name: "tags", widget: "list", default: [], required: false }
      - { label: "Макет", name: "layout", widget: "hidden", default: "page.njk" }
      - { label: "Содержимое", name: "body", widget: "markdown" }

  - name: "documents"
    label: "Документы"
    folder: "src/content/documents"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "src/uploads"
    public_folder: "/uploads"
    fields:
      - { label: "Название документа", name: "title", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime" }
      - { label: "Файл", name: "file", widget: "file" }
      - { label: "Описание", name: "description", widget: "text", required: false }
      - { label: "Рубрика", name: "rubric", widget: "relation", collection: "rubrics", searchFields: ["title"], valueField: "code", displayFields: ["title"], required: false }
      - { label: "Теги", name: "tags", widget: "list", default: [], required: false }

  # Рубрики - справочник для отношений между коллекциями
  - name: "rubrics"
    label: "Рубрики"
    folder: "src/_data/rubrics"
    create: false
    identifier_field: code
    summary: "{{code}}: {{title}}"
    fields:
      - { label: "Код", name: "code", widget: "string" }
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Уровень", name: "level", widget: "number", value_type: "int" }
