      - name: "rubric"
        label: "Рубрика"
        widget: "hidden"
        default: "1"
      - *tags
      - name: "layout"
        label: "Макет"
        widget: "select"
        options:
          - { label: "Страница раздела", value: "layouts/page-full.njk" }
          - { label: "Материал", value: "layouts/post.njk" }
        default: "layouts/post.njk"
      - name: "relatedCollection"
        label: "Связанные материалы"
        widget: "hidden"
        default: "abiturientam"
