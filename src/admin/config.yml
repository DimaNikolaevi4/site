backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

# Изображения и файлы загружаются в src/assets/uploads/
media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

# Определяем общие поля для повторного использования
_fields:
  - &title { label: "Заголовок", name: "title", widget: "string" }
  - &date { label: "Дата публикации", name: "date", widget: "datetime" }
  - &description { label: "Краткое описание", name: "description", widget: "text", required: false, hint: "Отображается в превью и SEO" }
  - &excerpt { label: "Отрывок", name: "excerpt", widget: "text", required: false, hint: "Краткое описание для списка материалов" }
  - &image { label: "Изображение", name: "image", widget: "image", required: false, hint: "Обложка материала" }
  - &rubric
    label: "Рубрика"
    name: "rubric"
    widget: "select"
    options:
      - { label: "Абитуриентам", value: "1" }
      - { label: "Сведения об ОО", value: "2" }
      - { label: "Учебно-методическая работа", value: "3" }
      - { label: "Воспитательная работа", value: "4" }
      - { label: "Социальное партнёрство", value: "5" }
      - { label: "Психологическое сопровождение", value: "6" }
      - { label: "Комплексная безопасность", value: "7" }
      - { label: "Студентам и родителям", value: "8" }
      - { label: "Общественное мнение", value: "9.4" }
      - { label: "Выпускникам", value: "9.5" }
      - { label: "Без рубрики", value: "0" }
    required: false
    hint: "Раздел, к которому относится материал"
  - &tags
    label: "Теги"
    name: "tags"
    widget: "list"
    required: false
    hint: "Ключевые слова через запятую"
  - &layout
    label: "Макет"
    name: "layout"
    widget: "select"
    options:
      - { label: "Страница раздела (page-full)", value: "layouts/page-full.njk" }
      - { label: "Материал (post)", value: "layouts/post.njk" }
      - { label: "Простая страница (page)", value: "layouts/page.njk" }
    default: "layouts/post.njk"
  - &body { label: "Содержимое", name: "body", widget: "markdown" }

collections:
  # === НОВОСТИ ===
  - name: "news"
    label: "Новости"
    label_singular: "Новость"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} — {{title}}"
    fields:
      - *title
      - *date
      - *description
      - *excerpt
      - *image
      - name: "author"
        label: "Автор"
        widget: "string"
        required: false
      - *rubric
      - name: "category"
        label: "Категория"
        widget: "hidden"
        default: "news"
      - *tags
      - name: "layout"
        label: "Макет"
        widget: "hidden"
        default: "layouts/post.njk"
      - name: "permalink"
        label: "Постоянная ссылка"
        widget: "hidden"
        default: "/news/{{slug}}/"
      - *body
      - name: "attachments"
        label: "Вложения"
        widget: "list"
        required: false
        fields:
          - { label: "Название", name: "name", widget: "string" }
          - { label: "Файл", name: "url", widget: "file" }
          - { label: "Размер", name: "size", widget: "string", required: false }

  # === СТАТЬИ И МАТЕРИАЛЫ ===
  - name: "materials"
    label: "Статьи и материалы"
    label_singular: "Материал"
    folder: "src/content/materials"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - *title
      - *date
      - *description
      - *excerpt
      - *image
      - *rubric
      - *tags
      - *layout
      - name: "permalink"
        label: "Постоянная ссылка"
        widget: "string"
        hint: "Например: /vospitanie/meropriyatie/"
      - *body

  # === СТРАНИЦЫ РАЗДЕЛОВ ===
  - name: "abiturientam"
